name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production SEO pages
        run: |
          node scripts/sync-products-to-spa.mjs
          node scripts/build-priority6-content.mjs
          node build-product-pages.mjs
          node build-column-pages.mjs
          node build-guide-pages.mjs
          node build-hub-pages.mjs

      - name: Verify generated internal URLs
        run: |
          node scripts/verify-public-urls.mjs
          node scripts/verify-indexing-priority5.mjs
          node scripts/verify-priority6.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.103.0"
          command: deploy
